<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satu Roll – Kamera tamu lewat QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#15130f;--card:#1f1c16;--line:#3a352a;--tx:#f3ecdc;--mut:#a39a85;--ac:#f4b400;--ok:#4fae7b}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'DM Sans',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:'Syne',system-ui,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.02em}
h2{font-size:1.5rem}
p{margin:.5em 0;color:var(--mut)}
a{color:var(--ac)}
.logo{display:block;font:800 1.1rem 'Syne';color:var(--tx);text-decoration:none;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#100e0b;color:var(--tx);font:inherit}
button,.btn{display:inline-block;border:0;border-radius:999px;padding:12px 20px;background:var(--ac);color:#15130f;font:700 1rem 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.ghost{background:none!important;color:var(--tx)!important;border:1px solid var(--line)!important}
.sm{padding:6px 12px!important;font-size:.85rem!important}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.full{width:100%;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.qr{background:#fff;padding:14px;border-radius:12px;width:fit-content;margin:12px auto}
.qr svg{display:block;width:200px;height:200px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;background:#000;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.acts{position:absolute;right:4px;top:4px;display:flex;gap:4px}
.stat{font:800 2.4rem 'Syne';color:var(--ac);line-height:1}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--tx);background:var(--ac);padding:0;display:block;margin:16px auto}
.shutter:active{transform:scale(.92)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mut)}
.err{color:#ff8a7a}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== ISI DUA BARIS INI (Supabase → Project Settings → API) ====== */
const SUPABASE_URL = 'https://rwtmgpnerkugljsuysmv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DQ1iN34ZL4HJvjIojQHpPA_SE-Jezh1';
/* =================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const FILTERS = { kodak: 'Kodak hangat', fuji: 'Fuji sejuk', bw: 'Hitam putih' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => new Date(t).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
const revealed = e => !e.reveal_at || new Date(e.reveal_at) <= new Date();
const purl = p => sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
const base = () => location.origin + location.pathname;
const hdr = () => '<a class="logo" data-nav href="' + location.pathname + '">✦ Satu Roll</a>';
let stream = null;
const stop = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
const nav = u => { history.pushState({}, '', u); route(); };
document.addEventListener('click', e => { const a = e.target.closest('a[data-nav]'); if (a) { e.preventDefault(); nav(a.getAttribute('href')); } });
window.addEventListener('popstate', route);

let lastUid = null;
sb.auth.onAuthStateChange((ev, s) => {
  const uid = s && s.user ? s.user.id : null;
  if (uid !== lastUid) { lastUid = uid; setTimeout(route, 0); }
});

async function route() {
  stop();
  const p = new URLSearchParams(location.search);
  if (p.get('e')) return guest(p.get('e'));
  if (p.get('d')) return dash(p.get('d'));
  return home();
}

async function home() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    app.innerHTML = hdr() + `<h1>Satu QR.<br>Semua sudut pandang.</h1>
    <p>Tamu scan QR, motret dari HP sendiri tanpa install aplikasi. Semua foto bertemu di dashboard kamu.</p>
    <form id="lf" class="card"><h2>Masuk sebagai pemilik acara</h2>
    <label for="em">Email</label><input id="em" type="email" required placeholder="kamu@email.com">
    <p id="lm"></p><button class="full">Kirim link masuk</button></form>`;
    document.getElementById('lf').onsubmit = async ev => {
      ev.preventDefault();
      const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('em').value, options: { emailRedirectTo: base() } });
      const m = document.getElementById('lm');
      m.className = error ? 'err' : ''; m.textContent = error ? error.message : 'Cek email kamu dan buka link masuknya.';
    };
    return;
  }
  const { data } = await sb.from('events').select('*').order('created_at', { ascending: false });
  const list = data || [];
  app.innerHTML = hdr() + `<form id="cf" class="card"><h2>Buat album acara</h2>
  <label for="n">Nama acara</label><input id="n" required maxlength="60" placeholder="Pernikahan Dina &amp; Raka">
  <label for="f">Gaya film</label><select id="f">${Object.entries(FILTERS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <label for="r">Foto dibuka untuk dilihat pada (opsional)</label><input id="r" type="datetime-local">
  <label for="x">Kamera tamu ditutup pada (opsional)</label><input id="x" type="datetime-local">
  <button class="full">Buat album</button></form>
  <div class="row spread"><h2>Album kamu</h2><button class="sm ghost" id="lo">Keluar</button></div>
  ${list.length ? list.map(e => `<a class="card row spread" data-nav style="text-decoration:none;color:inherit" href="?d=${e.id}"><b>${esc(e.name)}</b><span class="tag">${FILTERS[e.filter] || ''}</span></a>`).join('') : '<div class="empty">Belum ada album.</div>'}`;
  document.getElementById('lo').onclick = () => sb.auth.signOut();
  document.getElementById('cf').onsubmit = async ev => {
    ev.preventDefault();
    const r = document.getElementById('r').value, x = document.getElementById('x').value;
    const { data: d, error } = await sb.from('events').insert({
      name: document.getElementById('n').value.trim(), filter: document.getElementById('f').value,
      reveal_at: r ? new Date(r).toISOString() : null, ends_at: x ? new Date(x).toISOString() : null
    }).select().single();
    if (error) return alert(error.message);
    nav('?d=' + d.id);
  };
}

async function dash(id) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return nav(location.pathname);
  const { data: e } = await sb.from('events').select('*').eq('id', id).maybeSingle();
  if (!e) return nav(location.pathname);
  const st = await sb.rpc('event_stats', { eid: id });
  const s = (st.data && st.data[0]) || { photo_count: 0, guest_count: 0 };
  const open = revealed(e);
  const { data: ph } = await sb.from('photos').select('*').eq('event_id', id).order('created_at', { ascending: false });
  const photos = ph || [];
  const link = base() + '?e=' + id;
  let svg = '';
  try { const q = qrcode(0, 'M'); q.addData(link); q.make(); svg = q.createSvgTag(6, 0); } catch (x) { svg = '<p>QR gagal dibuat</p>'; }
  app.innerHTML = hdr() + `<a data-nav href="${location.pathname}">← Semua album</a>
  <h2 style="margin-top:12px">${esc(e.name)}</h2>
  <p>Gaya film: ${FILTERS[e.filter] || ''} · ${e.reveal_at ? 'Dibuka ' + fmt(e.reveal_at) : 'Tanpa jadwal buka'}</p>
  <div class="card" style="text-align:center"><div class="qr">${svg}</div><p>Cetak QR ini dan taruh di meja tamu.</p>
  <div class="row" style="justify-content:center"><button class="sm" id="cp">Salin link tamu</button>
  <a class="btn sm ghost" target="_blank" href="${link}">Coba sebagai tamu</a><button class="sm ghost" onclick="print()">Cetak</button></div></div>
  <div class="card row spread"><div><div class="stat">${s.photo_count}</div><p style="margin:0">foto</p></div>
  <div><div class="stat">${s.guest_count}</div><p style="margin:0">tamu</p></div>
  ${open ? '<span class="tag" style="color:var(--ok)">Terbuka</span>' : '<button class="sm" id="op">Buka sekarang</button>'}</div>
  <h2>Galeri</h2>
  ${!open ? `<p>Foto terkunci sampai ${fmt(e.reveal_at)} atau sampai kamu menekan "Buka sekarang".</p>` : ''}
  ${open && !photos.length ? '<div class="empty">Belum ada foto. Minta tamu scan QR di atas.</div>' : ''}
  <div class="grid">${photos.map(p => `<div class="ph"><img loading="lazy" src="${purl(p.path)}" alt="Foto oleh ${esc(p.guest_name)}">
  <div class="acts"><button class="sm ghost" data-dl="${p.id}" aria-label="Unduh">↓</button><button class="sm ghost" data-del="${p.id}" aria-label="Hapus">✕</button></div></div>`).join('')}</div>`;
  document.getElementById('cp').onclick = async () => { try { await navigator.clipboard.writeText(link); document.getElementById('cp').textContent = 'Tersalin ✓'; } catch (x) { prompt('Salin link:', link); } };
  const op = document.getElementById('op');
  if (op) op.onclick = async () => { await sb.from('events').update({ reveal_at: new Date().toISOString() }).eq('id', id); dash(id); };
  const byId = pid => photos.find(p => p.id === pid);
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Hapus foto ini?')) return;
    const p = byId(b.dataset.del);
    await sb.storage.from('photos').remove([p.path]); await sb.from('photos').delete().eq('id', p.id); dash(id);
  });
  app.querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
    const p = byId(b.dataset.dl), blob = await (await fetch(purl(p.path))).blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'foto-' + p.id.slice(0, 6) + '.jpg'; a.click();
  });
}

function film(c, f) {
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data, k = (v, s) => (v - 128) * s + 128;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if (f === 'bw') { const l = .3 * r + .59 * g + .11 * b; r = g = b = k(l, 1.25); }
    else if (f === 'fuji') { r = k(r * .95, 1.06); g = k(g * 1.06 + 3, 1.06); b = k(b * 1.08 + 4, 1.06); }
    else { r = k(r * 1.1 + 10, 1.1); g = k(g * 1.02 + 3, 1.1); b = k(b * .85, 1.1); }
    const n = (Math.random() - .5) * 30; d[i] = r + n; d[i + 1] = g + n; d[i + 2] = b + n;
  }
  x.putImageData(im, 0, 0);
  const g = x.createRadialGradient(c.width / 2, c.height / 2, c.width * .35, c.width / 2, c.height / 2, c.width * .85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
}

async function guest(id) {
  const { data: e } = await sb.from('events').select('*').eq('id', id).maybeSingle();
  if (!e) { app.innerHTML = hdr() + '<div class="empty"><h2>Album tidak ditemukan</h2><p>Periksa kembali QR atau linknya.</p></div>'; return; }
  if (e.ends_at && new Date(e.ends_at) < new Date()) { app.innerHTML = hdr() + `<div class="empty"><h2>${esc(e.name)}</h2><p>Kamera sudah ditutup. Terima kasih sudah ikut mengabadikan momen ini!</p></div>`; return; }
  let name = localStorage.getItem('sr_name') || '', n = Number(localStorage.getItem('sr_n_' + id) || 0);
  app.innerHTML = hdr() + `<h2>${esc(e.name)}</h2><p>Gaya film: ${FILTERS[e.filter] || ''}. Foto akan terlihat setelah album dibuka oleh pemilik acara.</p>
  <label for="gn">Nama kamu (opsional)</label><input id="gn" maxlength="30" value="${esc(name)}" placeholder="Tamu">
  <div id="st"><button class="full" id="go">Mulai motret</button></div><p id="ms"></p><p id="ct"></p>`;
  const ct = () => document.getElementById('ct').textContent = n + ' foto darimu sudah masuk ke album', ms = t => { const m = document.getElementById('ms'); m.className = t ? 'err' : ''; m.textContent = t || ''; };
  ct();
  const send = async c => {
    ms(''); document.getElementById('ms').textContent = 'Mengirim…';
    film(c, e.filter);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    const path = id + '/' + crypto.randomUUID() + '.jpg';
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) return ms('Gagal mengunggah. Coba lagi.');
    const ins = await sb.from('photos').insert({ event_id: id, guest_name: name || 'Tamu', path });
    if (ins.error) return ms('Acara sudah ditutup.');
    n++; localStorage.setItem('sr_n_' + id, n); ct(); document.getElementById('ms').textContent = '';
  };
  const fallback = () => {
    document.getElementById('st').innerHTML = '<label for="fi">Kamera langsung tidak tersedia. Ambil foto lewat tombol ini:</label><input id="fi" type="file" accept="image/*" capture="environment">';
    document.getElementById('fi').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      const im = new Image(); im.onload = () => {
        const s = Math.min(1, 1080 / im.width), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); send(c); ev.target.value = '';
      }; im.src = URL.createObjectURL(f);
    };
  };
  document.getElementById('go').onclick = async () => {
    name = document.getElementById('gn').value.trim(); localStorage.setItem('sr_name', name);
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }); } catch (x) { return fallback(); }
    document.getElementById('st').innerHTML = '<div class="cam"><video id="v" playsinline muted autoplay></video><div class="vig"></div></div><button class="shutter" id="sh" aria-label="Ambil foto"></button>';
    const v = document.getElementById('v'); v.srcObject = stream;
    document.getElementById('sh').onclick = () => {
      if (!v.videoWidth) return;
      const s = Math.min(1, 1080 / v.videoWidth), c = document.createElement('canvas'); c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); send(c);
    };
  };
}
route();
</script>
</body>
</html>
