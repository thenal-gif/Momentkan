<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentkan – Kamera tamu lewat QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f7ff;--card:#fff;--line:#e3e6f6;--tx:#1b1f3b;--mut:#646b92;--ac:#6a5cf6;--ok:#16a34a;--g:linear-gradient(135deg,#3b82f6,#8b5cf6)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.12;font-weight:800;margin:0}
h1{font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.025em}
h2{font-size:1.5rem}
p{margin:.5em 0;color:var(--mut)}
a{color:var(--ac)}
.logo{display:block;font:800 1.1rem 'Plus Jakarta Sans';color:var(--tx);text-decoration:none;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#100e0b;color:var(--tx);font:inherit}
button,.btn{display:inline-block;border:0;border-radius:999px;padding:12px 20px;background:var(--ac);color:#15130f;font:700 1rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.ghost{background:none!important;color:var(--tx)!important;border:1px solid var(--line)!important}
.sm{padding:6px 12px!important;font-size:.85rem!important}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.full{width:100%;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.qr{background:#fff;padding:14px;border-radius:12px;width:fit-content;margin:12px auto}
.qr svg{display:block;width:200px;height:200px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;background:#000;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.acts{position:absolute;right:4px;top:4px;display:flex;gap:4px}
.stat{font:800 2.4rem 'Plus Jakarta Sans';color:var(--ac);line-height:1}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--tx);background:var(--ac);padding:0;display:block;margin:16px auto}
.shutter:active{transform:scale(.92)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mut)}
.err{color:#ff8a7a}

main.wide{max-width:1040px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav .logo{margin:0}
.hero{display:grid;gap:32px;align-items:center;padding:16px 0 40px}
@media(min-width:820px){.hero{grid-template-columns:1.1fr .9fr;padding:48px 0 64px}}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem)}
.hero .lead{font-size:1.1rem;max-width:34em;margin:16px 0 24px}
.mini{font-size:.85rem}
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{position:relative;width:min(280px,78vw);aspect-ratio:9/18.5;background:#000;border-radius:38px;padding:9px;border:2px solid #4a4435;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 6px #201d16;transform:rotate(-3deg)}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#100e0b}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#000;border-radius:14px;z-index:5}
.pbar{position:absolute;top:0;left:0;right:0;z-index:4;padding:38px 14px 12px;background:linear-gradient(#100e0b 70%,transparent)}
.pbar b{font:800 .95rem 'Plus Jakarta Sans';display:block}
.pbar span{font-size:.72rem;color:var(--mut)}
.pbar em{color:var(--ac);font-style:normal;font-weight:700}
.cols{position:absolute;inset:0;display:flex;gap:6px;padding:0 6px}
.col{flex:1;overflow:hidden}
.track{display:flex;flex-direction:column;gap:6px;animation:up 28s linear infinite}
.col.b .track{animation-direction:reverse;animation-duration:34s}
@keyframes up{to{transform:translateY(-50%)}}
.tile{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:3/4;flex:none;transition:filter .4s}
.tile svg{width:100%;height:100%;display:block}
.tile::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));mix-blend-mode:multiply;pointer-events:none}
.tile i{position:absolute;left:5px;bottom:4px;font:normal 700 .7rem 'Plus Jakarta Sans';color:#fff;text-shadow:0 1px 3px #000}
.phone[data-f=kodak] .tile{filter:sepia(.28) saturate(1.3) contrast(1.06)}
.phone[data-f=fuji] .tile{filter:hue-rotate(14deg) saturate(1.1) contrast(1.05) brightness(1.04)}
.phone[data-f=bw] .tile{filter:grayscale(1) contrast(1.25)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:5;background:rgba(244,180,0,.96);color:#15130f;font:700 .75rem 'Plus Jakarta Sans';padding:8px 12px;border-radius:999px;text-align:center;transform:translateY(80px);transition:transform .35s}
.toast.on{transform:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:7px 14px!important;font-size:.85rem!important}
.chip.on{background:var(--ac)!important;color:#15130f!important;border-color:var(--ac)!important}
.sec{padding:40px 0}
.sec h2{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:8px}
.steps{display:grid;gap:12px;margin-top:20px}
@media(min-width:700px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:default;transition:transform .2s,border-color .2s}
.step:hover{transform:translateY(-4px);border-color:var(--ac)}
.step .n{font:800 2rem 'Plus Jakarta Sans';color:var(--ac)}
.step h3{margin:6px 0 4px;font:700 1.05rem 'Plus Jakarta Sans'}
.step p{margin:0;font-size:.92rem}
.feat{display:grid;gap:20px;margin-top:20px}
@media(min-width:700px){.feat{grid-template-columns:repeat(3,1fr)}}
.feat h3{margin:0 0 4px;font:700 1.05rem 'Plus Jakarta Sans'}
.feat p{margin:0}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::after{content:'+';color:var(--ac);font-size:1.3rem;line-height:1}
details[open] summary::after{content:'–'}
details p{margin:8px 0 0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
.cta{max-width:460px;margin:0 auto}
@media(prefers-reduced-motion:reduce){.track{animation:none}.rv{opacity:1;transform:none;transition:none}}

.wall{columns:2;column-gap:14px;margin-top:14px}
.pol{break-inside:avoid;margin:0 0 18px;background:#f6f1e4;padding:8px 8px 6px;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));transition:transform .25s}
.pol:hover{transform:rotate(0) scale(1.02)}
.wall .pimg{display:block;width:100%;padding:0;border-radius:2px;background:#222;cursor:zoom-in}
.pol img{display:block;width:100%;height:auto}
.pol figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 2px 2px;color:#2a241a}
.pol figcaption b{display:block;font:600 1.2rem 'Caveat',cursive;line-height:1.05}
.pol small{font-size:.68rem;color:#7a705c}
.pa{display:flex;gap:4px}
.pa a,.pa button{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;color:#2a241a;border:1px solid #cfc5ab;background:none;border-radius:50%;text-decoration:none;cursor:pointer}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:72vh;border:8px solid #f6f1e4;border-radius:3px;box-shadow:0 20px 60px #000;object-fit:contain}
.lb .cap{margin:12px 0 2px;font:600 1.5rem 'Caveat',cursive;color:#f6f1e4;text-align:center}
.lb .cnt{font-size:.8rem;color:var(--mut)}
.lb .bar{display:flex;gap:10px;margin-top:12px}
.lb .nv,.lb .x{position:absolute;padding:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:1.4rem;width:44px;height:44px}
.lb .nv{top:50%;transform:translateY(-50%)}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font-size:1.1rem}
.tix{display:flex;gap:14px;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#2a2412,#1f1c16);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;position:relative;overflow:hidden}
.tix::before,.tix::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);top:50%;margin-top:-9px}
.tix::before{left:-9px}.tix::after{right:-9px}
.tix small{color:var(--ac);font-weight:700;display:block;margin-bottom:4px}
.tix b{display:block;font:800 1.35rem 'Plus Jakarta Sans';line-height:1.15;word-break:break-word}
.tix span{display:block;font-size:.8rem;color:var(--mut);margin-top:4px}
.tix-qr{background:#fff;padding:6px;border-radius:8px;flex:none}
.tix-qr svg{display:block;width:72px;height:72px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts .opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px;border-radius:12px;background:#100e0b;color:var(--tx);border:1px solid var(--line);font-weight:500;cursor:pointer}
.opts .opt b{font-size:.88rem}
.opts .opt span{font-size:.68rem;color:var(--mut);font-weight:400;line-height:1.3}
.opts .opt.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset;background:#2a2412}
.sw{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:.95rem;cursor:pointer;margin-top:18px}
.sw input{position:absolute;opacity:0;width:0;padding:0;border:0}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.tg{background:var(--ac)}
.sw input:checked+.tg::after{transform:translateX(18px)}
.sw input:focus-visible+.tg{outline:2px solid var(--ac);outline-offset:2px}
.alb{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:14px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--tx);transition:transform .2s}
.alb:hover{transform:translateX(4px)}
.alb b{display:block}
.alb span{font-size:.8rem;color:var(--mut)}
.alb-r{text-align:right;flex:none}
.alb-r strong{font:800 1.5rem 'Plus Jakarta Sans';color:var(--ac);margin-right:4px}
.alb-r small{color:var(--mut)}
.alb-r .tag{display:block;margin-top:2px;font-style:normal}
.tag.ok{color:var(--ok)}

.plans{display:grid;gap:14px;margin-top:20px}
@media(min-width:820px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column}
.plan.hot{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.plan h3{font:800 1.3rem 'Plus Jakarta Sans';margin:0;display:flex;justify-content:space-between;align-items:center}
.plan .pr{font:800 2rem 'Plus Jakarta Sans';color:var(--ac);margin:8px 0 14px}
.plan ul{list-style:none;padding:0;margin:0 0 14px;color:var(--mut);flex:1}
.plan li{padding:8px 0;border-top:1px solid var(--line)}
.plan li b{color:var(--tx);font-size:1.15rem}
.sheet{position:fixed;inset:0;z-index:55;background:rgba(10,8,6,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sl .25s}
@keyframes sl{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}}
.gh{margin:6px 0 18px}
.gb{display:inline-block;color:var(--ac);font-weight:700;margin-bottom:8px}
.gt{font-size:clamp(2rem,9vw,3rem);animation:pop .6s both}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.shots i{width:22px;height:30px;border-radius:4px;border:2px dashed var(--line);display:block}
.shots i.u{background:var(--ac);border:2px solid var(--ac);animation:pop .4s both}
.lf{margin:4px 0 14px}.lf b{color:var(--ac);font-size:1.4rem}
.shut{display:block;font-size:1.1rem;padding:16px 20px;cursor:pointer}
.hint{font-size:.8rem;text-align:center}
.ths{display:flex;gap:10px;overflow-x:auto;margin-top:18px;padding:6px 2px}
.ths img{height:92px;flex:none;border:4px solid #f6f1e4;border-radius:2px;transform:rotate(-2deg);animation:pop .4s both}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:70;pointer-events:none;animation:cfa 1.7s ease-in forwards}
@keyframes cfa{to{transform:translateY(108vh) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.cf{display:none}.gt,.shots i.u,.ths img{animation:none}}

.wall{column-gap:10px}
.pol{position:relative;margin:0 0 10px;background:#000;padding:0;border-radius:14px;overflow:hidden;box-shadow:none;transform:none}
.pol:hover{transform:none}
.wall .pimg{border-radius:0}
.pol .nm{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font:700 .9rem 'Plus Jakarta Sans',sans-serif;pointer-events:none}
.pol .pa{position:absolute;top:8px;right:8px}
.pol .pa a,.pol .pa button{background:rgba(0,0,0,.5);color:#fff;border:0;width:30px;height:30px}
.lb img{border:0;border-radius:10px}
.lb .cap{font:700 1.1rem 'Plus Jakarta Sans',sans-serif}
.cam{aspect-ratio:auto;border-radius:18px}
.cam canvas{display:block;width:100%;height:auto}
.cam .fn{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:999px;transition:opacity .4s}
.cam .tl{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.cam .rb{width:38px;height:38px;padding:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:1.05rem}
.fstrip{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.fstrip::-webkit-scrollbar{display:none}
.fstrip .chip{flex:none}
.shrow{display:flex;justify-content:center;margin:6px 0}
.shutter:disabled{opacity:.4}
.ths .thb{padding:0;background:none;border-radius:10px;flex:none;overflow:hidden;cursor:zoom-in}
.ths img{border:0;transform:none;border-radius:10px;height:92px;display:block}
.phone .tile{filter:var(--ft,none)}
.tile i{font-size:.62rem}
.thb.pend{opacity:.55;position:relative}
.thb.pend::after{content:"Mengirim…";position:absolute;left:0;right:0;bottom:4px;font-size:.62rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}

/* ===== tema fresh: putih, biru, ungu ===== */
body{background:radial-gradient(900px 480px at 88% -8%,#e4e0ff 0,transparent 62%),radial-gradient(800px 460px at -8% 6%,#dbeafe 0,transparent 58%),var(--bg);background-attachment:fixed}
.card{box-shadow:0 8px 28px rgba(79,92,200,.08)}
input,select{background:#fff;color:var(--tx)}
input:focus,select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(106,92,246,.18)}
button,.btn{background:var(--g);color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.28)}
.ghost,.lb button,.pol .pa a,.pol .pa button,.cam .rb{box-shadow:none}
.chip.on{background:var(--g)!important;color:#fff!important;border-color:transparent!important}
.opts .opt{background:#fff;box-shadow:none}
.opts .opt.on{background:#eef1ff;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.sw input:checked+.tg{background:var(--g)}
.shots i.u{background:var(--g);border-color:transparent}
.err{color:#d93a3a}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{color:var(--tx)}
.sheet{background:rgba(27,31,59,.55)}
.tix{background:var(--g);border:0;color:#fff;box-shadow:0 14px 34px rgba(99,102,241,.3)}
.tix small{color:#e3e8ff}
.tix span{color:rgba(255,255,255,.82)}
.tix b{color:#fff}
.phone{--tx:#f4f5ff;--mut:#a9aed0;--ac:#9db4ff;border:2px solid #2a2f55;box-shadow:0 30px 70px rgba(79,92,200,.35),0 0 0 6px #e9ebff}
.screen{background:#101223}
.pbar{background:linear-gradient(#101223 70%,transparent)}
.toast{background:var(--g);color:#fff}
.note{font-size:.85rem;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:14px 0}
.ckl{list-style:none;padding:0;margin:12px 0}
.ckl li{padding:5px 0 5px 26px;position:relative}
.ckl li::before{content:'✓';position:absolute;left:0;color:var(--ac);font-weight:800}
.sep{border-top:1px solid var(--line);margin:18px 0 14px}
.plans{gap:18px}
.plan{padding:24px;border-radius:24px;box-shadow:0 10px 30px rgba(79,92,200,.08)}
.plan.hot{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 14px 34px rgba(99,102,241,.2)}
.ph2{display:flex;justify-content:space-between;align-items:center}
.plan h3{font-size:1.8rem}
.tg2{margin:4px 0 0}
.pbox{background:#eef1ff;border:1.5px solid var(--ac);border-radius:16px;padding:16px 18px;margin:18px 0 16px}
.pbox b{display:block;font:800 1.9rem 'Plus Jakarta Sans';color:var(--tx)}
.pbox span{color:var(--mut);font-size:.9rem}
.plan .sep{margin:20px 0 14px}
.plan h4{margin:0 0 6px;font:700 .95rem 'Plus Jakarta Sans'}
.plan ul{margin:0;flex:none}
.plan li{border:0;padding:5px 0 5px 26px;position:relative;color:var(--tx)}
.plan li::before{content:'✓';position:absolute;left:0;color:var(--ac);font-weight:800}
.plan .pr{display:none}
.oldp{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.oldp s{color:var(--mut);font-size:1rem}
.tag.disc{background:#e8e4ff;color:#5b3fd6;border:0;font-weight:700}

.why{max-width:680px}
.why b{display:block;font:800 1.4rem 'Plus Jakarta Sans',sans-serif;color:var(--tx);margin:6px 0 10px;line-height:1.3}
.why p{font-size:1.05rem;line-height:1.7}
.bnr,.gbn{position:relative;border-radius:18px;overflow:hidden;margin:12px 0;aspect-ratio:16/9;background:var(--g)}
.bnr img,.gbn img{width:100%;height:100%;object-fit:cover;display:block}
.bph{display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-weight:700}
.bacts{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.bacts .btn,.bacts label.btn{background:#fff;color:var(--tx);cursor:pointer;margin:0}
.bacts .ghost{background:rgba(255,255,255,.92)!important;color:var(--tx)!important}
.seg{display:inline-flex;background:#eef1ff;border-radius:999px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{background:none;color:var(--mut);box-shadow:none;padding:8px 16px;font-size:.9rem}
.seg button.on{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.lnk{word-break:break-all;font-size:.8rem;color:var(--mut);margin:4px 0 12px}
.promo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:24px 0;text-align:center}

function closeLb(){const el=document.getElementById('lb');if(el)el.hidden=true;document.body.style.overflow=''}
function lightbox(list,i,onDel){
  let el=document.getElementById('lb');
  if(!el){el=document.createElement('div');el.id='lb';el.className='lb';el.hidden=true;document.body.appendChild(el)}
  const show=()=>{
    const p=list[i];
    el.hidden=false;document.body.style.overflow='hidden';
    el.innerHTML=`<button class="x" aria-label="Tutup">✕</button>
    <button class="nv" style="left:8px" data-d="-1" aria-label="Sebelumnya">‹</button>

    <div class="cnt">${fmt(p.created_at)} · ${i+1} / ${list.length}</div>

    el.querySelector('.x').onclick=closeLb;
    el.querySelectorAll('.nv').forEach(b=>b.onclick=()=>go(Number(b.dataset.d)));
    el.querySelector('[data-del]').onclick=()=>onDel(list[i]);
  };
  const go=d=>{i=(i+d+list.length)%list.length;show()};
  el.onclick=ev=>{if(ev.target===el)closeLb()};
  let sx=0;
  el.ontouchstart=ev=>{sx=ev.changedTouches[0].clientX};
  el.ontouchend=ev=>{const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)go(dx<0?1:-1)};
  document.onkeydown=ev=>{if(el.hidden)return;if(ev.key==='Escape')closeLb();if(ev.key==='ArrowLeft')go(-1);if(ev.key==='ArrowRight')go(1)};
  show();
}

/* ===== Photobooth: frame kolase ===== */
const FRAMES = {
  single: { n: 'Foto tunggal', c: 1 },
  duo: { n: 'Duo', c: 2, s: 640, cols: 1 },
  strip3: { n: 'Strip 3', c: 3, s: 560, cols: 1 },
  strip4: { n: 'Strip 4', c: 4, s: 480, cols: 1 },
  grid4: { n: 'Kolase 2×2', c: 4, s: 480, cols: 2 },
  grid6: { n: 'Kolase 2×3', c: 6, s: 420, cols: 2 }
};
const COLS = { putih: ['Putih', '#ffffff', '#1b1f3b'], krem: ['Krem', '#f6efe2', '#3a2f20'], hitam: ['Hitam', '#111111', '#f5f5f5'], pink: ['Pink', '#fbd9e0', '#5a2a3a'], gradasi: ['Gradasi', 'grad', '#ffffff'] };
const layoutOf = id => {
  const f = FRAMES[id], m = 40, g = 24, cap = 170, s = f.s, cols = f.cols, rows = Math.ceil(f.c / cols);
  const W = 2 * m + cols * s + (cols - 1) * g, H = m + rows * s + (rows - 1) * g + cap;
  return { W, H, slots: Array.from({ length: f.c }, (_, i) => [m + (i % cols) * (s + g), m + Math.floor(i / cols) * (s + g), s, s]), cap: [0, H - cap, W, cap] };
};
const frameThumb = id => {
  if (id === 'single') return '<svg viewBox="0 0 60 80" aria-hidden="true"><rect x="4" y="4" width="52" height="72" rx="4" fill="#c9d1ff"/></svg>';
  const L = layoutOf(id);
  return `<svg viewBox="0 0 ${L.W} ${L.H}" aria-hidden="true"><rect x="5" y="5" width="${L.W - 10}" height="${L.H - 10}" rx="24" fill="#fff" stroke="#c9ceea" stroke-width="10"/>${L.slots.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#c9d1ff"/>`).join('')}<rect x="${L.W * .25}" y="${L.H - 100}" width="${L.W * .5}" height="24" rx="12" fill="#c9ceea"/></svg>`;
};
const slotAt = (cv, ev, L) => { const r = cv.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * L.W, py = (ev.clientY - r.top) / r.height * L.H; return L.slots.findIndex(([x, y, w, h]) => px >= x && px <= x + w && py >= y && py <= y + h); };
const cover = (im, w, h) => {
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height, r = Math.max(c.width / iw, c.height / ih), dw = iw * r, dh = ih * r;
  c.getContext('2d').drawImage(im, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh); return c;
};
const setFit = (x, text, weight, maxW, start) => { let px = start; const set = () => x.font = weight + ' ' + px + "px 'Plus Jakarta Sans', sans-serif"; set(); while (x.measureText(text).width > maxW && px > 14) { px -= 2; set(); } };
/* o: { imgs, id, col, f, r:{fn,cv}|null, scale, guest, ev } -> canvas */
const composeFrame = o => {
  const { imgs, id, f, scale, r } = o;
  const filt = (src, w, h) => { if (!r || f === 'original') return src; r.fn(src, w, h, f); return r.cv; };
  if (id === 'single') {
    const im = imgs[0], k = Math.min(1, 1800 / Math.max(im.width, im.height)) * scale, w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
    const t = document.createElement('canvas'); t.width = w; t.height = h; t.getContext('2d').drawImage(im, 0, 0, w, h);
    const out = document.createElement('canvas'); out.width = w; out.height = h; out.getContext('2d').drawImage(filt(t, w, h), 0, 0); return out;
  }
  const L = layoutOf(id), bg = COLS[o.col][1], ink = COLS[o.col][2];
  const cv = document.createElement('canvas'); cv.width = Math.round(L.W * scale); cv.height = Math.round(L.H * scale);
  const x = cv.getContext('2d'); x.scale(scale, scale);
  if (bg === 'grad') { const gr = x.createLinearGradient(0, 0, L.W, L.H); gr.addColorStop(0, '#3b82f6'); gr.addColorStop(1, '#8b5cf6'); x.fillStyle = gr; } else x.fillStyle = bg;
  x.fillRect(0, 0, L.W, L.H);

    const w = Math.round(sw * scale), h = Math.round(sh * scale);

  });

  x.textAlign = 'center'; x.fillStyle = ink;

  x.globalAlpha = .55; x.font = "700 22px 'Plus Jakarta Sans', sans-serif"; x.fillText('Momentkan', cx, cy + 146); x.globalAlpha = 1;
  return cv;
};

    if (vid && f.size > 10 * 1024 * 1024) return alert('Video terlalu besar. Di album sungguhan maksimal 10 MB.');

  };

  $('dwh').oninput = () => { D.when = $('dwh').value; paint(); };

  $('dgo').onclick = () => nav(location.pathname + '#paket');

async function dash(id) {

  const open = revealed(e), gvOn = e.guest_view !== false;

  const photos = ph || [];
  const links = { cam: base() + '?e=' + id, alb: base() + '?v=' + id };
  const qrOf = u => { try { const q = qrcode(0, 'M'); q.addData(u); q.make(); return q.createSvgTag(6, 0); } catch (x) { return '<p>QR gagal dibuat</p>'; } };
  app.innerHTML = hdr() + `<a data-nav href="?app=1">← Semua album</a>
  <div class="bnr">${e.banner_path ? mediaHTML(e.banner_path) : '<div class="bph">Belum ada banner</div>'}
    <div class="bacts"><label class="btn sm" for="bf" id="bl">${e.banner_path ? 'Ganti banner' : 'Tambah banner'}</label>${e.banner_path ? '<button class="sm ghost" id="bd">Hapus</button>' : ''}<input id="bf" type="file" accept="image/*,video/*" hidden></div></div>
  <p class="mini" style="margin:0 0 10px">Banner tampil di halaman tamu. Pakai foto (dipotong otomatis 16:9) atau video pendek maksimal 12 detik dan 10 MB.</p>
  <div class="row spread" id="nm" style="gap:8px"><h2 style="margin:0">${esc(e.name)}</h2><button class="sm ghost" id="ed">Ubah nama</button></div>
  <p>Paket ${(PLANS[e.plan] || PLANS.basic).name} · ${e.max_guests || '∞'} tamu · ${e.shots_per_guest || 5} foto/tamu</p>
  <div class="card" style="text-align:center">
    <div class="seg" id="sg"><button class="on" data-t="cam">Kamera tamu</button><button data-t="alb">Album tamu</button></div>
    <div class="qr" id="qr">${qrOf(links.cam)}</div>
    <p id="qd"></p><p class="lnk" id="ql"></p>
    <div class="row" style="justify-content:center"><button class="sm" id="cp">Salin link</button>${navigator.share ? '<button class="sm" id="sh">Bagikan</button>' : ''}<a class="btn sm ghost" id="try" target="_blank" href="${links.cam}">Coba</a><button class="sm ghost" id="pt">Cetak QR</button></div>
  </div>
  <div class="card row spread"><div><div class="stat">${s.photo_count}</div><p style="margin:0">foto</p></div>
  <div><div class="stat">${s.guest_count}${e.max_guests ? '<small style="font-size:1rem"> / ' + e.max_guests + '</small>' : ''}</div><p style="margin:0">tamu</p></div></div>
  <div class="card"><label class="sw" style="margin:0"><input type="checkbox" id="gv" ${gvOn ? 'checked' : ''}><span class="tg"></span>Izinkan tamu melihat album</label>
    <p class="mini" style="margin:8px 0 0">${!gvOn ? 'Tamu tidak bisa melihat album. Mereka hanya melihat pemberitahuan bahwa kamu belum mengizinkan.' : open ? 'Album sudah bisa dilihat semua tamu lewat link album.' : 'Tamu melihat pemberitahuan: album bisa dilihat mulai ' + fmt(e.reveal_at) + '.'}</p>
    ${gvOn && !open ? '<button class="sm" id="op" style="margin-top:10px">Buka untuk tamu sekarang</button>' : ''}</div>
  <h2>Galeri</h2>
  ${photos.length ? '' : '<div class="empty">Belum ada foto. Minta tamu scan QR di atas.</div>'}
  <div class="wall">${photos.map((p, i) => `<figure class="pol"><button class="pimg" data-open="${i}" aria-label="Lihat foto"><img loading="lazy" src="${purl(thumbOf(p.path))}" onerror="this.onerror=null;this.src='${purl(p.path)}'" alt="Foto oleh ${esc(p.guest_name)}"></button><span class="nm">${esc(p.guest_name || 'Tamu')}</span><span class="pa"><a download href="${purl(p.path, 'momentkan-' + p.id.slice(0, 6) + '.jpg')}" aria-label="Unduh">↓</a><button data-del="${p.id}" aria-label="Hapus">✕</button></span></figure>`).join('')}</div>`;
  const $ = i => document.getElementById(i);
  // tab QR
  let tab = 'cam';
  const descs = { cam: 'Tamu scan QR ini untuk memotret. Taruh di meja tamu.', alb: 'Bagikan QR dan link ini supaya semua tamu bisa melihat dan menyimpan seluruh foto album.' + (!gvOn ? ' Saat ini tamu belum diizinkan melihat album.' : open ? '' : ' Album baru bisa dilihat tamu mulai ' + fmt(e.reveal_at) + '.') };
  const showTab = () => { $('qr').innerHTML = qrOf(links[tab]); $('qd').textContent = descs[tab]; $('ql').textContent = links[tab]; $('try').href = links[tab]; app.querySelectorAll('#sg button').forEach(b => b.classList.toggle('on', b.dataset.t === tab)); };
  app.querySelectorAll('#sg button').forEach(b => b.onclick = () => { tab = b.dataset.t; showTab(); });
  showTab();
  $('cp').onclick = async () => { try { await navigator.clipboard.writeText(links[tab]); $('cp').textContent = 'Tersalin ✓'; setTimeout(() => $('cp').textContent = 'Salin link', 1800); } catch (x) { prompt('Salin link:', links[tab]); } };
  $('pt').onclick = () => posterModal(e, links, tab);
  if ($('sh')) $('sh').onclick = () => navigator.share({ title: e.name, text: tab === 'cam' ? 'Ayo ikut memotret di ' + e.name : 'Lihat semua foto ' + e.name, url: links[tab] }).catch(() => {});
  // ubah nama
  $('ed').onclick = () => {
    $('nm').innerHTML = `<input id="en" maxlength="60" value="${esc(e.name)}" aria-label="Nama album" style="flex:1;min-width:0"><button class="sm" id="es">Simpan</button><button class="sm ghost" id="ec">Batal</button>`;
    $('en').focus(); $('ec').onclick = () => dash(id);
    $('es').onclick = async () => { const v = $('en').value.trim(); if (!v) return; const u = await sb.from('events').update({ name: v }).eq('id', id); if (u.error) return alert(u.error.message); dash(id); };
  };
  // banner
  $('bf').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const lab = $('bl'); lab.textContent = 'Mengunggah…';
    const fail = m => { lab.textContent = e.banner_path ? 'Ganti banner' : 'Tambah banner'; alert(m); };
    let blob, ext, ctype;
    if (f.type.startsWith('video/')) {
      if (f.size > 10 * 1024 * 1024) return fail('Video terlalu besar. Maksimal 10 MB.');
      const dur = await new Promise(res => { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); res(v.duration); }; v.onerror = () => res(0); v.src = URL.createObjectURL(f); });
      if (!dur) return fail('Video tidak bisa dibaca. Gunakan format MP4.');
      if (dur > 12) return fail('Video terlalu panjang. Maksimal 12 detik.');
      blob = f; ctype = f.type; ext = f.type.includes('webm') ? 'webm' : f.type.includes('quicktime') ? 'mov' : 'mp4';
    } else {
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); }).catch(() => null);
      if (!im) return fail('File gambar tidak bisa dibaca.');
      URL.revokeObjectURL(im.src);
      const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
      const r = Math.max(1280 / im.naturalWidth, 720 / im.naturalHeight), w = im.naturalWidth * r, h = im.naturalHeight * r;
      c.getContext('2d').drawImage(im, (1280 - w) / 2, (720 - h) / 2, w, h);
      blob = await new Promise(r2 => c.toBlob(r2, 'image/jpeg', .85)); ctype = 'image/jpeg'; ext = 'jpg';
    }
    const path = id + '/b_' + crypto.randomUUID() + '.' + ext;
    const up = await sb.storage.from('banners').upload(path, blob, { contentType: ctype, cacheControl: '31536000' });
    if (up.error) return fail('Gagal mengunggah banner: ' + up.error.message);
    const u = await sb.from('events').update({ banner_path: path }).eq('id', id);
    if (u.error) return fail(u.error.message);
    if (e.banner_path) await removeBanner(e.banner_path);
    dash(id);
  };
  if ($('bd')) $('bd').onclick = async () => { if (!confirm('Hapus banner?')) return; await sb.from('events').update({ banner_path: null }).eq('id', id); await removeBanner(e.banner_path); dash(id); };
  // buka untuk tamu
  $('gv').onchange = async () => { const u = await sb.from('events').update({ guest_view: $('gv').checked }).eq('id', id); if (u.error) alert(u.error.message); dash(id); };
  const op = $('op');
  if (op) op.onclick = async () => { await sb.from('events').update({ reveal_at: new Date().toISOString() }).eq('id', id); dash(id); };
  // galeri
  const byId = pid => photos.find(p => p.id === pid);
  const delPhoto = async p => { if (!confirm('Hapus foto ini?')) return false; await sb.storage.from('photos').remove([p.path, thumbOf(p.path)]); await sb.from('photos').delete().eq('id', p.id); return true; };
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (await delPhoto(byId(b.dataset.del))) dash(id); });
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => lightbox(photos, Number(b.dataset.open), async p => { if (await delPhoto(p)) { closeLb(); dash(id); } }));
}

function confetti(){
  const cs=['#f4b400','#ef5b5b','#4fae7b','#5b8def','#f6f1e4','#e86f9a'];
  for(let i=0;i<36;i++){const d=document.createElement('span');d.className='cf';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%cs.length]};animation-delay:${Math.random()*.4}s;border-radius:${i%3?'2px':'50%'}`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function viewer(items,i){
  let el=document.getElementById('lb');
  if(!el){el=document.createElement('div');el.id='lb';el.className='lb';el.hidden=true;document.body.appendChild(el)}
  const show=()=>{
    const p=items[i];el.hidden=false;document.body.style.overflow='hidden';
    el.innerHTML=`<button class="x" aria-label="Tutup">✕</button>${items.length>1?'<button class="nv" style="left:8px" data-d="-1" aria-label="Sebelumnya">‹</button><button class="nv" style="right:8px" data-d="1" aria-label="Berikutnya">›</button>':''}
    <img src="${p.url}" alt="Fotomu"><div class="cap">${esc(p.name)}</div><div class="cnt">${i+1} / ${items.length}</div>
    <div class="bar"><a class="btn sm" download="momentkan-${i+1}.jpg" href="${p.dl||p.url}">Simpan ke HP</a></div>`;
    el.querySelector('.x').onclick=closeLb;
    el.querySelectorAll('.nv').forEach(b=>b.onclick=()=>go(Number(b.dataset.d)));
  };
  const go=d=>{i=(i+d+items.length)%items.length;show()};
  el.onclick=ev=>{if(ev.target===el)closeLb()};
  let sx=0;el.ontouchstart=ev=>{sx=ev.changedTouches[0].clientX};
  el.ontouchend=ev=>{const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&items.length>1)go(dx<0?1:-1)};
  document.onkeydown=ev=>{if(el.hidden)return;if(ev.key==='Escape')closeLb();if(ev.key==='ArrowLeft')go(-1);if(ev.key==='ArrowRight')go(1)};
  show();
}

async function guest(id) {
  const gr = await sb.rpc('get_event', { eid: id });
  const e = gr.data && gr.data[0];
  if (!e) { app.innerHTML = hdr() + '<div class="empty"><h2>Album tidak ditemukan</h2><p>Periksa kembali QR atau linknya.</p></div>'; return; }
  if (e.ends_at && new Date(e.ends_at) < new Date()) { app.innerHTML = hdr() + `<div class="empty"><h2>${esc(e.name)}</h2><p>Kamera sudah ditutup. Terima kasih sudah ikut mengabadikan momen ini!</p></div>`; return; }
  let gid = localStorage.getItem('sr_gid'); if (!gid) { gid = crypto.randomUUID(); localStorage.setItem('sr_gid', gid); }
  const sr = await sb.rpc('guest_status', { eid: id, gid });
  const s0 = (sr.data && sr.data[0]) || { used: 0, guest_full: false };
  const mp = await sb.rpc('my_photos', { eid: id, gid });
  let used = s0.used, full = s0.guest_full, limit = e.shots_per_guest || 5;
  let name = localStorage.getItem('sr_name') || '', pending = 0;
  window.onbeforeunload = ev => { if (pending) { ev.preventDefault(); ev.returnValue = ''; } };
  const mine = (mp.data || []).map(r => ({ url: purl(r.path), thumb: purl(thumbOf(r.path)), dl: purl(r.path, 'momentkan-' + r.path.slice(-10)), name: r.guest_name || 'Tamu' }));
  const gAllowed = e.guest_view !== false, gOpen = gAllowed && (!e.reveal_at || new Date(e.reveal_at) <= new Date());
  const gMsg = !gAllowed ? 'Pemilik belum mengizinkan tamu melihat album.' : gOpen ? 'Album sudah bisa dilihat semua tamu.' : 'Album bisa dilihat mulai ' + fmt(e.reveal_at) + '.';
  app.innerHTML = hdr() + (e.banner_path ? `<div class="gbn">${mediaHTML(e.banner_path)}</div>` : '') + `<div class="gh"><span class="gb">Photobooth</span><h1 class="gt">${esc(e.name)}</h1></div><div id="roll"></div><div id="st"></div><p id="ms"></p><div class="ths" id="th"></div>
  <a class="btn ghost full" data-nav href="?v=${id}">Lihat semua foto album</a><p class="mini" style="text-align:center">${gMsg}</p>${promoHTML()}`;
  const st = document.getElementById('st'), roll = document.getElementById('roll'), th = document.getElementById('th');
  const ms = (t, ok) => { const m = document.getElementById('ms'); if (!m) return; m.className = t && !ok ? 'err' : ''; m.textContent = t || ''; };
  const left = () => Math.max(0, limit - used);
  const drawRoll = () => { roll.innerHTML = `<div class="shots" role="img" aria-label="${used} dari ${limit} jatah terpakai">${Array.from({ length: limit }, (_, i) => `<i class="${i < used ? 'u' : ''}"></i>`).join('')}</div><p class="lf"><b>${left()}</b> jatah foto tersisa</p>`; };
  const drawTh = () => { th.innerHTML = mine.map((m, i) => `<button class="thb${m.pend ? ' pend' : ''}" data-i="${i}" aria-label="Lihat fotomu"><img src="${m.thumb || m.url}" onerror="this.onerror=null;this.src='${m.url}'" alt="Fotomu"></button>`).join(''); th.querySelectorAll('.thb').forEach(b => b.onclick = () => viewer(mine, Number(b.dataset.i))); };
  let frame = 'strip3', fcol = 'putih', curF = 'original', shots = [], pend = -1, stage = 'intro';
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); inp.hidden = true; app.appendChild(inp);
  inp.onchange = ev => {
    const f = ev.target.files[0]; ev.target.value = ''; if (!f || pend < 0) return;

      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src);
      shots[pend] = c; pend = -1; stage === 'review' ? review() : capture();
    };
    im.src = URL.createObjectURL(f);
  };

  const intro = () => {
    stage = 'intro'; shots = []; pend = -1; drawRoll();
    if (full) { st.innerHTML = '<div class="card"><h2>Kuota tamu penuh</h2><p>Album ini sudah mencapai batas jumlah tamu. Terima kasih sudah mampir!</p></div>'; return; }
    if (!left()) { st.innerHTML = '<div class="card"><h2>Jatahmu sudah habis</h2><p>Terima kasih sudah ikut mengabadikan momen ini. Kamu tetap bisa melihat album lewat tombol di bawah.</p></div>'; return; }
    st.innerHTML = `<label for="gn">Nama kamu</label><input id="gn" maxlength="30" value="${esc(name)}" placeholder="Tamu"><button class="full shut" id="go">Mulai photobooth</button><p class="hint">Pilih frame kolase, ambil fotonya, lalu pilih filter dan kirim. Satu hasil dihitung satu jatah.</p>`;
    document.getElementById('go').onclick = () => { name = document.getElementById('gn').value.trim(); localStorage.setItem('sr_name', name); pickFrame(); };
  };

  const pickFrame = () => {
    stage = 'pick';
    st.innerHTML = `<h3 style="margin:6px 0 0">Pilih frame</h3><div class="frames">${Object.entries(FRAMES).map(([k, f]) => `<button type="button" class="fr${k === frame ? ' on' : ''}" data-k="${k}">${frameThumb(k)}<b>${f.n}</b><span>${f.c} foto</span></button>`).join('')}</div><button class="full" id="fgo">Lanjut</button><button class="ghost full" id="fbk" style="margin-top:8px">Kembali</button>`;

    document.getElementById('fgo').onclick = () => { shots = new Array(FRAMES[frame].c).fill(null); capture(); };
    document.getElementById('fbk').onclick = intro;
  };

  const capture = () => {
    stage = 'capture';
    const f = FRAMES[frame], next = shots.findIndex(x => !x);
    if (next < 0) return review();
    st.innerHTML = `<p class="mini" style="margin:4px 0">${f.n} · foto ${next + 1} dari ${f.c}</p><div id="cp"></div><button class="full shut" id="snap">Ambil foto ${next + 1}</button><button class="ghost full" id="chg" style="margin-top:8px">Ganti frame</button>`;
    if (frame !== 'single') {

    }
    document.getElementById('snap').onclick = () => { pend = next; inp.click(); };
    document.getElementById('chg').onclick = pickFrame;
  };

  const review = async () => {
    stage = 'review'; ms('');
    try { await document.fonts.load("800 40px 'Plus Jakarta Sans'"); } catch (x) {}
    const gl = (() => { const c = document.createElement('canvas'), fn = mkGL(c); return fn ? { fn, cv: c } : null; })();
    const single = frame === 'single', L = single ? null : layoutOf(frame);

    ${single ? '' : `<label>Warna frame</label><div class="chips" id="fc" style="justify-content:flex-start">${Object.entries(COLS).map(([k, v]) => `<button class="chip ghost${k === fcol ? ' on' : ''}" data-c="${k}">${v[0]}</button>`).join('')}</div><p class="mini">Ketuk salah satu foto di kolase untuk mengambilnya ulang.</p>`}
    <p class="mini" style="text-align:center;margin-top:10px">Atas nama <b>${esc(name || 'Tamu')}</b></p>
    <div class="row" style="margin-top:10px"><button id="sd" style="flex:1">Kirim</button><button class="ghost" id="rt">Ulangi</button></div>`;
    const draw = () => {
      const cv = composeFrame({ imgs: shots, id: frame, col: fcol, f: curF, r: gl, scale: single ? .45 : Math.min(1, 640 / L.W), guest: name, ev: e.name });
      cv.style.cssText = 'width:100%;display:block;border-radius:10px;box-shadow:0 8px 24px rgba(27,31,59,.15)' + (single ? '' : ';cursor:pointer');
      if (!single) cv.onclick = ev => { const i = slotAt(cv, ev, L); if (i >= 0) { pend = i; inp.click(); } };
      const box = document.getElementById('pv'); box.innerHTML = ''; box.appendChild(cv);
    };
    draw();
    st.querySelectorAll('#fs .chip').forEach(c => c.onclick = () => { curF = c.dataset.f; st.querySelectorAll('#fs .chip').forEach(x => x.classList.toggle('on', x === c)); draw(); });
    st.querySelectorAll('#fc .chip').forEach(c => c.onclick = () => { fcol = c.dataset.c; st.querySelectorAll('#fc .chip').forEach(x => x.classList.toggle('on', x === c)); draw(); });
    document.getElementById('rt').onclick = pickFrame;
    document.getElementById('sd').onclick = () => {
      const b = document.getElementById('sd'); b.disabled = true; b.textContent = 'Menyiapkan…';
      const nm = name || 'Tamu';
      setTimeout(async () => {
        const full = composeFrame({ imgs: shots, id: frame, col: fcol, f: curF, r: gl, scale: 1, guest: nm, ev: e.name });
        const k = Math.min(1, 480 / Math.min(full.width, full.height), 900 / Math.max(full.width, full.height));
        const t = document.createElement('canvas'); t.width = Math.round(full.width * k); t.height = Math.round(full.height * k); t.getContext('2d').drawImage(full, 0, 0, t.width, t.height);
        const toB = (cv, q) => new Promise(r2 => cv.toBlob(r2, 'image/jpeg', q));
        sendOut(await toB(full, .85), await toB(t, .8), nm);
      }, 30);
    };
  };

  const sendOut = async (blob, thumb, nm) => {
    const item = { url: URL.createObjectURL(blob), name: nm, pend: true };
    mine.unshift(item); used++; pending++; drawTh(); intro();
    ms('Hasilmu dikirim di latar belakang. Kamu bisa lanjut, tapi jangan tutup halaman ini.', true);
    const stem = id + '/' + crypto.randomUUID(), path = stem + '.jpg';
    const opt = { contentType: 'image/jpeg', cacheControl: '31536000' };
    const [up] = await Promise.all([sb.storage.from('photos').upload(path, blob, opt), thumb ? sb.storage.from('photos').upload(stem + '_t.jpg', thumb, opt) : null]);
    let err = up.error;
    if (!err) { const ins = await sb.from('photos').insert({ event_id: id, guest_name: nm, guest_id: gid, path }); err = ins.error; }
    pending--;
    if (err) {
      mine.splice(mine.indexOf(item), 1); drawTh();
      const q = await sb.rpc('guest_status', { eid: id, gid });
      if (q.data && q.data[0]) { used = q.data[0].used; full = q.data[0].guest_full; } else used = Math.max(0, used - 1);
      drawRoll(); ms('Satu hasil gagal terkirim. Jatahmu dikembalikan, silakan coba lagi.');
      return;
    }
    item.pend = false; drawTh(); confetti(); if (navigator.vibrate) navigator.vibrate(40);
    ms(pending ? 'Masih mengirim ' + pending + '…' : (left() ? 'Terkirim! Masih ada ' + left() + ' jatah.' : 'Terkirim! Itu jatah terakhirmu.'), true);
  };
  drawTh(); intro();
}
