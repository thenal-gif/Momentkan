<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentkan – Kamera tamu lewat QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#15130f;--card:#1f1c16;--line:#3a352a;--tx:#f3ecdc;--mut:#a39a85;--ac:#f4b400;--ok:#4fae7b}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.12;font-weight:800;margin:0}
h1{font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.025em}
h2{font-size:1.5rem}
p{margin:.5em 0;color:var(--mut)}
a{color:var(--ac)}
.logo{display:block;font:800 1.1rem 'Plus Jakarta Sans';color:var(--tx);text-decoration:none;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#100e0b;color:var(--tx);font:inherit}
button,.btn{display:inline-block;border:0;border-radius:999px;padding:12px 20px;background:var(--ac);color:#15130f;font:700 1rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.ghost{background:none!important;color:var(--tx)!important;border:1px solid var(--line)!important}
.sm{padding:6px 12px!important;font-size:.85rem!important}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.full{width:100%;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.qr{background:#fff;padding:14px;border-radius:12px;width:fit-content;margin:12px auto}
.qr svg{display:block;width:200px;height:200px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;background:#000;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.acts{position:absolute;right:4px;top:4px;display:flex;gap:4px}
.stat{font:800 2.4rem 'Plus Jakarta Sans';color:var(--ac);line-height:1}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--tx);background:var(--ac);padding:0;display:block;margin:16px auto}
.shutter:active{transform:scale(.92)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mut)}
.err{color:#ff8a7a}

main.wide{max-width:1040px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav .logo{margin:0}
.hero{display:grid;gap:32px;align-items:center;padding:16px 0 40px}
@media(min-width:820px){.hero{grid-template-columns:1.1fr .9fr;padding:48px 0 64px}}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem)}
.hero .lead{font-size:1.1rem;max-width:34em;margin:16px 0 24px}
.mini{font-size:.85rem}
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{position:relative;width:min(280px,78vw);aspect-ratio:9/18.5;background:#000;border-radius:38px;padding:9px;border:2px solid #4a4435;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 6px #201d16;transform:rotate(-3deg)}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#100e0b}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#000;border-radius:14px;z-index:5}
.pbar{position:absolute;top:0;left:0;right:0;z-index:4;padding:38px 14px 12px;background:linear-gradient(#100e0b 70%,transparent)}
.pbar b{font:800 .95rem 'Plus Jakarta Sans';display:block}
.pbar span{font-size:.72rem;color:var(--mut)}
.pbar em{color:var(--ac);font-style:normal;font-weight:700}
.cols{position:absolute;inset:0;display:flex;gap:6px;padding:0 6px}
.col{flex:1;overflow:hidden}
.track{display:flex;flex-direction:column;gap:6px;animation:up 28s linear infinite}
.col.b .track{animation-direction:reverse;animation-duration:34s}
@keyframes up{to{transform:translateY(-50%)}}
.tile{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:3/4;flex:none;transition:filter .4s}
.tile svg{width:100%;height:100%;display:block}
.phone:not([data-f=original]) .tile::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));mix-blend-mode:multiply;pointer-events:none}
.tile i{position:absolute;left:5px;bottom:4px;font:normal 700 .7rem 'Plus Jakarta Sans';color:#fff;text-shadow:0 1px 3px #000}
.phone[data-f=kodak] .tile{filter:sepia(.28) saturate(1.3) contrast(1.06)}
.phone[data-f=fuji] .tile{filter:hue-rotate(14deg) saturate(1.1) contrast(1.05) brightness(1.04)}
.phone[data-f=bw] .tile{filter:grayscale(1) contrast(1.25)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:5;background:rgba(244,180,0,.96);color:#15130f;font:700 .75rem 'Plus Jakarta Sans';padding:8px 12px;border-radius:999px;text-align:center;transform:translateY(80px);transition:transform .35s}
.toast.on{transform:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:7px 14px!important;font-size:.85rem!important}
.chip.on{background:var(--ac)!important;color:#15130f!important;border-color:var(--ac)!important}
.sec{padding:40px 0}
.sec h2{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:8px}
.steps{display:grid;gap:12px;margin-top:20px}
@media(min-width:700px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:default;transition:transform .2s,border-color .2s}
.step:hover{transform:translateY(-4px);border-color:var(--ac)}
.step .n{font:800 2rem 'Plus Jakarta Sans';color:var(--ac)}
.step h3{margin:6px 0 4px;font:700 1.05rem 'Plus Jakarta Sans'}
.step p{margin:0;font-size:.92rem}
.feat{display:grid;gap:20px;margin-top:20px}
@media(min-width:700px){.feat{grid-template-columns:repeat(3,1fr)}}
.feat h3{margin:0 0 4px;font:700 1.05rem 'Plus Jakarta Sans'}
.feat p{margin:0}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::after{content:'+';color:var(--ac);font-size:1.3rem;line-height:1}
details[open] summary::after{content:'–'}
details p{margin:8px 0 0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
.cta{max-width:460px;margin:0 auto}
@media(prefers-reduced-motion:reduce){.track{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== ISI DUA BARIS INI (Supabase → Project Settings → API) ====== */
const SUPABASE_URL = 'https://rwtmgpnerkugljsuysmv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DQ1iN34ZL4HJvjIojQHpPA_SE-Jezh1';
/* =================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const FILTERS = { original: 'Original', kodak: 'Kodak hangat', fuji: 'Fuji sejuk', bw: 'Hitam putih' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => new Date(t).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
const revealed = e => !e.reveal_at || new Date(e.reveal_at) <= new Date();
const purl = p => sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
const base = () => location.origin + location.pathname;
const hdr = () => '<a class="logo" data-nav href="' + location.pathname + '">✦ Momentkan</a>';
let stream = null;
const stop = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
const nav = u => { history.pushState({}, '', u); route(); };
document.addEventListener('click', e => { const a = e.target.closest('a[data-nav]'); if (a) { e.preventDefault(); nav(a.getAttribute('href')); } });
window.addEventListener('popstate', route);

let lastUid = null;
sb.auth.onAuthStateChange((ev, s) => {
  const uid = s && s.user ? s.user.id : null;
  if (uid !== lastUid) { lastUid = uid; setTimeout(route, 0); }
});

async function route() {
  stop(); app.classList.remove('wide');
  const p = new URLSearchParams(location.search);
  if (p.get('e')) return guest(p.get('e'));
  if (p.get('d')) return dash(p.get('d'));
  return home();
}


const SC=[
 ['#f6a04d','#e8567a',x=>`<circle cx="50" cy="62" r="18" fill="#fff3c4"/><path d="M0 100Q30 80 55 98T100 90V130H0Z" fill="#3b2a4a"/>`,'Rina'],
 ['#7fc8d8','#f7e3b5',x=>`<g stroke="#fff" stroke-width="1"><path d="M30 60V105M52 50V105M72 64V105"/></g><circle cx="30" cy="50" r="14" fill="#ef5b5b"/><circle cx="52" cy="38" r="15" fill="#f4b400"/><circle cx="72" cy="52" r="13" fill="#5b8def"/>`,'Bima'],
 ['#2d2b3f','#7a3b5e',x=>`<path d="M50 92C20 70 24 42 42 44c6 0 8 4 8 8 0 -4 2 -8 8 -8 18 -2 22 26 -8 48Z" fill="#ff7a8a"/>`,'Dina'],
 ['#fbd9c4','#c98b7a',x=>`<rect x="26" y="70" width="48" height="26" rx="3" fill="#fff"/><rect x="34" y="50" width="32" height="20" rx="3" fill="#f7c6d0"/><rect x="48" y="36" width="4" height="14" fill="#f4b400"/><circle cx="50" cy="33" r="4" fill="#ff9b3d"/>`,'Sari'],
 ['#1f4d4a','#d9b26f',x=>`<circle cx="42" cy="66" r="18" fill="none" stroke="#f6d98b" stroke-width="5"/><circle cx="60" cy="66" r="18" fill="none" stroke="#fff3c4" stroke-width="5"/>`,'Raka'],
 ['#3b2f6b','#e86f9a',x=>`${[[20,30,5],[70,24,4],[40,52,6],[82,70,5],[26,86,4],[58,96,6]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#f4b400"/>`).join('')}<circle cx="50" cy="75" r="16" fill="#fff3c4"/>`,'Tomi'],
 ['#b8d8a8','#f2efc9',x=>`<path d="M16 120V60A34 34 0 0 1 84 60V120" fill="none" stroke="#fff" stroke-width="7"/><circle cx="22" cy="58" r="7" fill="#ef7b9b"/><circle cx="78" cy="58" r="7" fill="#f4b400"/><circle cx="50" cy="26" r="7" fill="#ef7b9b"/>`,'Maya'],
 ['#ff9a5a','#8a3b6b',x=>`<path d="M0 104Q40 70 100 100V130H0Z" fill="#2b1d3a"/><circle cx="72" cy="50" r="12" fill="#ffe08a"/>`,'Eko']
];
const tile=i=>{const s=SC[i%8];return `<div class="tile"><svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset="1" stop-color="${s[1]}"/></linearGradient></defs><rect width="100" height="130" fill="url(#g${i})"/>${s[2]()}</svg><i>${s[3]}</i></div>`};
const col=(ids)=>{const h=ids.map(tile).join('');return `<div class="track">${h}${h}</div>`};

function landing(){
  app.classList.add('wide');
  app.innerHTML=`
  <header class="nav"><a class="logo" data-nav href="${location.pathname}">✦ Momentkan</a><button class="sm ghost" data-go>Masuk</button></header>
  <section class="hero">
    <div>
      <h1>Semua momen, dari semua sudut.</h1>
      <p class="lead">Momentkan mengubah HP setiap tamu menjadi kamera sekali pakai. Mereka scan QR, jepret, dan semua foto berkumpul di satu album milikmu.</p>
      <div class="row"><button data-go>Buat album acara</button><a class="btn ghost" href="#how">Lihat cara kerja</a></div>
      <p class="mini">Cocok untuk pernikahan, ulang tahun, reuni, sampai liburan bareng.</p>
    </div>
    <div class="phonewrap">
      <div class="phone" data-f="original"><div class="notch"></div><div class="screen">
        <div class="pbar"><b>Pernikahan Dina &amp; Raka</b><span><em id="pc">128</em> momen dari <em>34</em> tamu</span></div>
        <div class="cols"><div class="col a">${col([0,1,2,3,4,5,6,7])}</div><div class="col b">${col([4,7,1,5,2,6,3,0])}</div></div>
        <div class="toast" id="ts"></div>
      </div></div>
      <div class="chips" role="group" aria-label="Pilih gaya film">
        <button class="chip ghost on" data-f="original">Original</button><button class="chip ghost" data-f="kodak">Kodak hangat</button><button class="chip ghost" data-f="fuji">Fuji sejuk</button><button class="chip ghost" data-f="bw">Hitam putih</button>
      </div>
      <p class="mini">Coba ganti gaya film — tampilan album ikut berubah.</p>
    </div>
  </section>

  <section class="sec rv" id="how"><h2>Dari satu hari jadi satu album</h2><p>Empat langkah, semuanya dari HP.</p>
    <div class="steps">
      <div class="step"><div class="n">1</div><h3>Buat album</h3><p>Beri nama acara, pilih gaya film, dan atur kapan foto boleh dilihat.</p></div>
      <div class="step"><div class="n">2</div><h3>Bagikan QR</h3><p>Cetak QR atau kirim link ke grup. Tempel di meja tamu.</p></div>
      <div class="step"><div class="n">3</div><h3>Tamu memotret</h3><p>Scan, kamera langsung terbuka, dan foto otomatis diberi efek film.</p></div>
      <div class="step"><div class="n">4</div><h3>Buka albumnya</h3><p>Setelah acara, buka album dan unduh semua kenangan.</p></div>
    </div></section>

  <section class="sec rv"><h2>Kenapa Momentkan</h2>
    <div class="feat">
      <div><h3>Cukup scan QR</h3><p>Tamu cukup membuka kamera HP dan scan QR. Berfungsi di iPhone, Android, dan komputer.</p></div>
      <div><h3>Rasa kamera sekali pakai</h3><p>Setiap foto diberi warna, grain, dan vignette ala film, jadi hasilnya terasa seperti kenangan.</p></div>
      <div><h3>Kejutan di akhir</h3><p>Foto terkunci sampai kamu membukanya, jadi semua orang melihat hasilnya bersamaan.</p></div>
    </div></section>

  <section class="sec rv"><h2>Pertanyaan umum</h2>
    <details><summary>Apakah tamu perlu install aplikasi?</summary><p>Tidak. Tamu cukup scan QR atau membuka link di browser HP mereka.</p></details>
    <details><summary>Kapan saya bisa melihat fotonya?</summary><p>Kamu yang menentukan: atur jadwal buka saat membuat album, atau tekan "Buka sekarang" kapan saja.</p></details>
    <details><summary>Bisakah foto diunduh?</summary><p>Bisa. Setiap foto dapat diunduh dari dashboard setelah album dibuka.</p></details>
    <details><summary>Bagaimana kalau acara sudah selesai?</summary><p>Kamu bisa menutup kamera tamu pada waktu tertentu, sehingga tidak ada foto baru yang masuk.</p></details>
  </section>

  <section class="sec rv" id="login"><div class="cta"><form id="lf" class="card"><h2>Mulai buat album</h2>
    <button type="button" class="full ghost" id="gg" style="display:flex;align-items:center;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Lanjutkan dengan Google</button>
    <p style="text-align:center;margin:12px 0 0">atau masuk dengan email</p>
    <label for="em">Email</label><input id="em" type="email" required placeholder="kamu@email.com">
    <p id="lm"></p><button class="full">Kirim link masuk</button></form></div></section>`;

  const login=document.getElementById('login');
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{login.scrollIntoView({behavior:'smooth'});setTimeout(()=>document.getElementById('em').focus({preventScroll:true}),500)});
  app.querySelectorAll('a[href="#how"]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById('how').scrollIntoView({behavior:'smooth'})});
  const ph=app.querySelector('.phone');
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ph.dataset.f=c.dataset.f;app.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c))});
  const names=['Rina','Bima','Sari','Eko','Maya','Tomi','Dina','Raka'];let n=128,k=0;
  clearInterval(window._tt);
  window._tt=setInterval(()=>{
    const ts=document.getElementById('ts');if(!ts){clearInterval(window._tt);return}
    n++;k++;document.getElementById('pc').textContent=n;
    ts.textContent='+1 foto dari '+names[k%names.length];ts.classList.add('on');setTimeout(()=>ts.classList.remove('on'),1800);
  },3200);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
  app.querySelectorAll('.rv').forEach(el=>io.observe(el));
  document.getElementById('gg').onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:base()}});if(error){const m=document.getElementById('lm');m.className='err';m.textContent=error.message}};
  document.getElementById('lf').onsubmit=async ev=>{
    ev.preventDefault();
    const {error}=await sb.auth.signInWithOtp({email:document.getElementById('em').value,options:{emailRedirectTo:base()}});
    const m=document.getElementById('lm');m.className=error?'err':'';m.textContent=error?error.message:'Cek email kamu dan buka link masuknya.';
  };
}

async function home() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return landing();
  const { data } = await sb.from('events').select('*').order('created_at', { ascending: false });
  const list = data || [];
  app.innerHTML = hdr() + `<form id="cf" class="card"><h2>Buat album acara</h2>
  <label for="n">Nama acara</label><input id="n" required maxlength="60" placeholder="Pernikahan Dina &amp; Raka">
  <label for="f">Gaya film</label><select id="f">${Object.entries(FILTERS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <label for="r">Foto dibuka untuk dilihat pada (opsional)</label><input id="r" type="datetime-local">
  <label for="x">Kamera tamu ditutup pada (opsional)</label><input id="x" type="datetime-local">
  <button class="full">Buat album</button></form>
  <div class="row spread"><h2>Album kamu</h2><button class="sm ghost" id="lo">Keluar</button></div>
  ${list.length ? list.map(e => `<a class="card row spread" data-nav style="text-decoration:none;color:inherit" href="?d=${e.id}"><b>${esc(e.name)}</b><span class="tag">${FILTERS[e.filter] || ''}</span></a>`).join('') : '<div class="empty">Belum ada album.</div>'}`;
  document.getElementById('lo').onclick = () => sb.auth.signOut();
  document.getElementById('cf').onsubmit = async ev => {
    ev.preventDefault();
    const r = document.getElementById('r').value, x = document.getElementById('x').value;
    const { data: d, error } = await sb.from('events').insert({
      name: document.getElementById('n').value.trim(), filter: document.getElementById('f').value,
      reveal_at: r ? new Date(r).toISOString() : null, ends_at: x ? new Date(x).toISOString() : null
    }).select().single();
    if (error) return alert(error.message);
    nav('?d=' + d.id);
  };
}

async function dash(id) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return nav(location.pathname);
  const { data: e } = await sb.from('events').select('*').eq('id', id).maybeSingle();
  if (!e) return nav(location.pathname);
  const st = await sb.rpc('event_stats', { eid: id });
  const s = (st.data && st.data[0]) || { photo_count: 0, guest_count: 0 };
  const open = revealed(e);
  const { data: ph } = await sb.from('photos').select('*').eq('event_id', id).order('created_at', { ascending: false });
  const photos = ph || [];
  const link = base() + '?e=' + id;
  let svg = '';
  try { const q = qrcode(0, 'M'); q.addData(link); q.make(); svg = q.createSvgTag(6, 0); } catch (x) { svg = '<p>QR gagal dibuat</p>'; }
  app.innerHTML = hdr() + `<a data-nav href="${location.pathname}">← Semua album</a>
  <h2 style="margin-top:12px">${esc(e.name)}</h2>
  <p>Gaya film: ${FILTERS[e.filter] || ''} · ${e.reveal_at ? 'Dibuka ' + fmt(e.reveal_at) : 'Tanpa jadwal buka'}</p>
  <div class="card" style="text-align:center"><div class="qr">${svg}</div><p>Cetak QR ini dan taruh di meja tamu.</p>
  <div class="row" style="justify-content:center"><button class="sm" id="cp">Salin link tamu</button>
  <a class="btn sm ghost" target="_blank" href="${link}">Coba sebagai tamu</a><button class="sm ghost" onclick="print()">Cetak</button></div></div>
  <div class="card row spread"><div><div class="stat">${s.photo_count}</div><p style="margin:0">foto</p></div>
  <div><div class="stat">${s.guest_count}</div><p style="margin:0">tamu</p></div>
  ${open ? '<span class="tag" style="color:var(--ok)">Terbuka</span>' : '<button class="sm" id="op">Buka sekarang</button>'}</div>
  <h2>Galeri</h2>
  ${!open ? `<p>Foto terkunci sampai ${fmt(e.reveal_at)} atau sampai kamu menekan "Buka sekarang".</p>` : ''}
  ${open && !photos.length ? '<div class="empty">Belum ada foto. Minta tamu scan QR di atas.</div>' : ''}
  <div class="grid">${photos.map(p => `<div class="ph"><img loading="lazy" src="${purl(p.path)}" alt="Foto oleh ${esc(p.guest_name)}">
  <div class="acts"><button class="sm ghost" data-dl="${p.id}" aria-label="Unduh">↓</button><button class="sm ghost" data-del="${p.id}" aria-label="Hapus">✕</button></div></div>`).join('')}</div>`;
  document.getElementById('cp').onclick = async () => { try { await navigator.clipboard.writeText(link); document.getElementById('cp').textContent = 'Tersalin ✓'; } catch (x) { prompt('Salin link:', link); } };
  const op = document.getElementById('op');
  if (op) op.onclick = async () => { await sb.from('events').update({ reveal_at: new Date().toISOString() }).eq('id', id); dash(id); };
  const byId = pid => photos.find(p => p.id === pid);
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Hapus foto ini?')) return;
    const p = byId(b.dataset.del);
    await sb.storage.from('photos').remove([p.path]); await sb.from('photos').delete().eq('id', p.id); dash(id);
  });
  app.querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
    const p = byId(b.dataset.dl), blob = await (await fetch(purl(p.path))).blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'foto-' + p.id.slice(0, 6) + '.jpg'; a.click();
  });
}

function film(c, f) {
  if (f === 'original') return;
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data, k = (v, s) => (v - 128) * s + 128;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if (f === 'bw') { const l = .3 * r + .59 * g + .11 * b; r = g = b = k(l, 1.25); }
    else if (f === 'fuji') { r = k(r * .95, 1.06); g = k(g * 1.06 + 3, 1.06); b = k(b * 1.08 + 4, 1.06); }
    else { r = k(r * 1.1 + 10, 1.1); g = k(g * 1.02 + 3, 1.1); b = k(b * .85, 1.1); }
    const n = (Math.random() - .5) * 30; d[i] = r + n; d[i + 1] = g + n; d[i + 2] = b + n;
  }
  x.putImageData(im, 0, 0);
  const g = x.createRadialGradient(c.width / 2, c.height / 2, c.width * .35, c.width / 2, c.height / 2, c.width * .85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
}

async function guest(id) {
  const { data: e } = await sb.from('events').select('*').eq('id', id).maybeSingle();
  if (!e) { app.innerHTML = hdr() + '<div class="empty"><h2>Album tidak ditemukan</h2><p>Periksa kembali QR atau linknya.</p></div>'; return; }
  if (e.ends_at && new Date(e.ends_at) < new Date()) { app.innerHTML = hdr() + `<div class="empty"><h2>${esc(e.name)}</h2><p>Kamera sudah ditutup. Terima kasih sudah ikut mengabadikan momen ini!</p></div>`; return; }
  let name = localStorage.getItem('sr_name') || '', n = Number(localStorage.getItem('sr_n_' + id) || 0);
  app.innerHTML = hdr() + `<h2>${esc(e.name)}</h2><p>Gaya film: ${FILTERS[e.filter] || ''}. Foto akan terlihat setelah album dibuka oleh pemilik acara.</p>
  <label for="gn">Nama kamu (opsional)</label><input id="gn" maxlength="30" value="${esc(name)}" placeholder="Tamu">
  <div id="st"><button class="full" id="go">Mulai motret</button></div><p id="ms"></p><p id="ct"></p>`;
  const ct = () => document.getElementById('ct').textContent = n + ' foto darimu sudah masuk ke album', ms = t => { const m = document.getElementById('ms'); m.className = t ? 'err' : ''; m.textContent = t || ''; };
  ct();
  const send = async c => {
    ms(''); document.getElementById('ms').textContent = 'Mengirim…';
    film(c, e.filter);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    const path = id + '/' + crypto.randomUUID() + '.jpg';
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) return ms('Gagal mengunggah. Coba lagi.');
    const ins = await sb.from('photos').insert({ event_id: id, guest_name: name || 'Tamu', path });
    if (ins.error) return ms('Acara sudah ditutup.');
    n++; localStorage.setItem('sr_n_' + id, n); ct(); document.getElementById('ms').textContent = '';
  };
  const fallback = () => {
    document.getElementById('st').innerHTML = '<label for="fi">Kamera langsung tidak tersedia. Ambil foto lewat tombol ini:</label><input id="fi" type="file" accept="image/*" capture="environment">';
    document.getElementById('fi').onchange = ev => {
      const f = ev.target.files[0]; if (!f) return;
      const im = new Image(); im.onload = () => {
        const s = Math.min(1, 1080 / im.width), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); send(c); ev.target.value = '';
      }; im.src = URL.createObjectURL(f);
    };
  };
  document.getElementById('go').onclick = async () => {
    name = document.getElementById('gn').value.trim(); localStorage.setItem('sr_name', name);
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }); } catch (x) { return fallback(); }
    document.getElementById('st').innerHTML = '<div class="cam"><video id="v" playsinline muted autoplay></video>' + (e.filter === 'original' ? '' : '<div class="vig"></div>') + '</div><button class="shutter" id="sh" aria-label="Ambil foto"></button>';
    const v = document.getElementById('v'); v.srcObject = stream;
    document.getElementById('sh').onclick = () => {
      if (!v.videoWidth) return;
      const s = Math.min(1, 1080 / v.videoWidth), c = document.createElement('canvas'); c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); send(c);
    };
  };
}
route();
</script>
